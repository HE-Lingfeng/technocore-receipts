[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-receipts"
version = "0.1.0"
description = "Offline signature and transcript checks for Technocore JSONL exports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["cryptography>=41"]

[project.scripts]
technocore-receipts = "technocore_receipts.cli:main"

[tool.setuptools.packages.find]
include = ["technocore_receipts*"]
